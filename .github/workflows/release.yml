name: Release verificata

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-client-test:
    name: Test client Windows AMD64
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Scarica il sorgente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configura Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test client e recupero
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: >-
          go test
          ./internal/filesecurity
          ./internal/client
          ./internal/cryptfile
          ./cmd/onlybackup
          ./cmd/onlybackup-recover

      - name: Controlla lo script PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/backup-file.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  release:
    name: Linux e client Windows AMD64
    needs: windows-client-test
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Scarica il sorgente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configura Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Controlla il tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag non valido: usare v1.2.3" >&2
            exit 1
          fi

      - name: Test e analisi statica
        run: make check

      - name: Race detector
        run: make race

      - name: Crea archivio e checksum
        run: |
          ./scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist
          ./scripts/package-windows-client.sh "${GITHUB_REF_NAME#v}" dist

      - name: Attesta la provenienza
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Pubblica la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/*.zip dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "OnlyBackup $GITHUB_REF_NAME"
