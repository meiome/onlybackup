name: Release verificata

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Linux AMD64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Scarica il sorgente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configura Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Controlla il tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag non valido: usare v1.2.3" >&2
            exit 1
          fi

      - name: Test e analisi statica
        run: make check

      - name: Race detector
        run: make race

      - name: Crea archivio e checksum
        run: ./scripts/package-release.sh "${GITHUB_REF_NAME#v}" dist

      - name: Attesta la provenienza
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Pubblica la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --generate-notes
          --title "OnlyBackup $GITHUB_REF_NAME"
