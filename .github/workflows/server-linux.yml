name: Server Linux

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux AMD64
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Scarica il sorgente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configura Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test e analisi statica
        run: make check

      - name: Race detector
        run: make race

      - name: Smoke test HTTPS e recupero
        run: make smoke

      - name: Test di sistema con binari reali
        run: make system-test

      - name: Test mount systemd reali e regressione EXDEV
        run: sudo python3 scripts/systemd-layout-test.py
